{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="login-wrap">
  <div class="login-caja">
    <h1>Iniciar sesión</h1>
    <p class="subt" style="text-align:center;color:var(--texto-tenue);margin-top:-10px;">ALMACENES T&amp;P - Sistema para Demo</p>
    {% if form.errors %}
    <div class="mensaje mensaje-error">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="campo">
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="campo">
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primario" style="width:100%;justify-content:center;">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
