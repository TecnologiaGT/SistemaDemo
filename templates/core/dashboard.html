{% extends "base.html" %}
{% block titulo %}Inicio{% endblock %}

{% block extra_css %}
{% if tiene_foto_fondo %}
<style>
  body {
    background-image: linear-gradient(rgba(10,14,30,0.72), rgba(10,14,30,0.82)), url('{% url "core:personalizacion_foto" %}?v={{ personalizacion.actualizado|date:"U" }}');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
</style>
{% endif %}
{% endblock %}

{% block contenido %}
<div class="titulo-pagina">
  <div>
    <h1>Panel principal</h1>
    <div class="subt">Selecciona un módulo para comenzar</div>
  </div>
</div>

<div class="grid-menu">
  {% for m in modulos %}
  <a class="tarjeta-menu" href="{% url m.url %}">
    <span class="icono">{{ m.icono }}</span>
    <span class="nombre">{{ m.nombre }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
